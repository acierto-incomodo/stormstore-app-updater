<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte</title>
    <link rel="stylesheet" href="soporte.css">
</head>
<body>
    <div class="first-launch-container">
        <div class="first-launch-card">
            <img src="app-logo.png" alt="Logo de la aplicación" class="app-logo">
            <h1>Bienvenido a Soporte</h1>
            <h2>Asistencia técnica</h2>
            <p>Estamos aquí para ayudarte con cualquier pregunta o problema que puedas tener.</p>
            <form action="mailto:meliodas.aitor@gmail.com" method="post" enctype="text/plain" class="support-form">
                <div class="form-group">
                    <label for="asunto">Asunto</label>
                    <input type="text" id="asunto" name="subject" required placeholder="Ej: Error en la aplicación">
                </div>
                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="body" rows="4" required placeholder="Describe tu problema o solicitud..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Enviar Correo</button>
            </form>
        </div>
    </div>
    <script src="soporte.js"></script>
</body>
</html>
