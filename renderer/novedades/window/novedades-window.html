<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novedades - StormStore</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
        --color-background: #121212;
        --color-surface: #1e1e1e;
        --color-surface-container: #252525;
        --color-surface-container-high: #2b2b2b;
        --color-primary: #fdd835;
        --color-on-primary: #000000;
        --color-primary-hover: #c28b00;
        --color-outline: #938f99;
        --color-on-surface: #e6e1e5;
        --color-on-surface-variant: #cac4d0;
        color: var(--color-on-surface);
        background: var(--color-background);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--color-outline);
      }

      header {
        flex: 0 0 auto;
        padding: 22px 28px 16px;
        border-bottom: 1px solid var(--color-outline);
        -webkit-app-region: drag;
      }

      header p {
        margin: 0 0 6px;
        color: var(--color-primary);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(21px, 4vw, 29px);
        overflow-wrap: anywhere;
      }

      main {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding: 20px 28px 28px;
        scrollbar-color: var(--color-outline) var(--color-surface-container);
        scrollbar-width: thin;
      }

      #release-status {
        margin: 0;
        color: var(--color-on-surface-variant);
        line-height: 1.6;
      }

      #release-body {
        overflow-wrap: anywhere;
        line-height: 1.65;
      }

      #release-body h1,
      #release-body h2,
      #release-body h3,
      #release-body h4,
      #release-body h5,
      #release-body h6 {
        margin: 1.25em 0 0.5em;
      }

      #release-body p,
      #release-body ul {
        margin: 0 0 0.85em;
      }

      #release-body ul {
        padding-left: 1.5em;
      }

      #release-body a {
        color: var(--color-primary);
      }

      #release-body code {
        padding: 2px 6px;
        border-radius: 5px;
        background: var(--color-surface-container);
        font-family: Consolas, monospace;
      }

      footer {
        display: flex;
        flex: 0 0 auto;
        justify-content: flex-end;
        gap: 10px;
        padding: 14px 20px;
        border-top: 1px solid var(--color-outline);
        background: var(--color-surface);
      }

      button {
        min-height: 38px;
        padding: 0 18px;
        border: 1px solid var(--color-outline);
        border-radius: 8px;
        color: var(--color-on-surface);
        background: var(--color-surface-container);
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: var(--color-surface-container-high);
      }

      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }

      #close-button {
        border-color: var(--color-primary);
        color: var(--color-on-primary);
        background: var(--color-primary);
        font-weight: 600;
      }

      #close-button:hover {
        background: var(--color-primary-hover);
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 520px) {
        header {
          padding: 18px 18px 14px;
        }

        main {
          padding: 18px;
        }

        footer {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <p id="release-version">StormStore</p>
      <h1 id="release-title">Novedades</h1>
    </header>

    <main id="release-content" tabindex="0">
      <p id="release-status">Cargando novedades…</p>
      <article id="release-body"></article>
    </main>

    <footer>
      <button id="scroll-end-button" type="button" hidden>Ir al final</button>
      <button id="close-button" type="button">Cerrar</button>
    </footer>

    <script src="novedades-window.js"></script>
  </body>
</html>
